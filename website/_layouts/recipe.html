<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ page.title }} | {{ site.title }}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>
	<div class="container py-4 recipe-page">
		<a href="/" class="btn btn-outline-secondary btn-sm mb-3 recipe-back-btn">Back to cookbook</a>

		<article class="card p-4 recipe-shell">
			<header class="recipe-header mb-4">
				<h1 class="h2 mb-3">{{ page.title }}</h1>
				<div class="d-flex flex-wrap align-items-center gap-2 recipe-meta-row">
					{% if page.status != "🟩" %}
					<span class="badge text-bg-secondary">{{ page.status }}</span>
					{% endif %}
					{% if page.recipe-type %}
					<a href="{{ '/' | relative_url }}?type={{ page.recipe-type | cgi_escape }}" class="badge text-bg-primary text-decoration-none">{{ page.recipe-type }}</a>
					{% endif %}
					{% if page.recipe-tags %}
						{% for tag in page.recipe-tags %}
						<a href="{{ '/' | relative_url }}?tag={{ tag | cgi_escape }}" class="badge text-bg-secondary text-decoration-none">{{ tag }}</a>
						{% endfor %}
					{% endif %}
				</div>
			</header>

			{% if page.thumbnail %}
			<figure class="recipe-hero mb-4">
				<img src="{{ page.thumbnail }}" alt="{{ page.title }}" loading="lazy" class="img-fluid rounded-4 w-100">
			</figure>
			{% endif %}

			<div class="recipe-content">
				{{ content }}
			</div>
		</article>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>

</html>
