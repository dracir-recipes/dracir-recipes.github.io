notes:
  - "Assign exactly one recipe type to each recipe."
  - "Use recipe-tags for cross-cutting filters such as vegan, winter, Japanese, or make-ahead."

types:
  - id: breakfast
    label: Breakfast
    description: Breakfast-first dishes that are primarily intended for the first meal of the day.

  - id: baked-good
    label: Baked Good
    description: Breads, muffins, scones, bars, and similar baked items that are not primarily plated desserts.

  - id: condiment
    label: Condiment
    description: Sauces, dressings, marinades, and flavor-building components served with other dishes.

  - id: dessert
    label: Dessert
    description: Sweet dishes, plated desserts, frozen desserts, and dessert-focused fillings or toppings.

  - id: drink
    label: Drink
    description: Drinkable preparations, tonics, or spoonable frozen treats treated primarily as beverages.

  - id: main
    label: Main
    description: Full meals or center-of-plate dishes substantial enough to anchor a meal.

  - id: preserving
    label: Preserving
    description: Ferments, cures, and other recipes whose main purpose is preservation or long storage.

  - id: salad
    label: Salad
    description: Composed salads, grain salads, and bowl-style cold assemblies where the salad format defines the dish.

  - id: side
    label: Side
    description: Sides, accompaniments, and smaller supporting dishes served alongside a main dish.

  - id: snack
    label: Snack
    description: Portable, shareable, or between-meal foods that are lighter than a main dish.

  - id: soup
    label: Soup
    description: Soups, stews, chowders, ramen-style broths, and other spoonable savory bowls.