name: Second Brain Update

on:
	push:
		paths:
			- 'raw'
			- 'raw/**'
			- '.github/workflows/secondBrainUpdate.yml'
			- 'secondBrainProcessing/**'
	repository_dispatch:
		types:
			- secondbrain-updated
	workflow_dispatch:

permissions:
	contents: read

concurrency:
	group: second-brain-update
	cancel-in-progress: true

jobs:
	process-second-brain:
		runs-on: ubuntu-latest

		steps:
			- name: Checkout repository
				uses: actions/checkout@v4
				with:
					submodules: recursive

			- name: Update raw submodule to latest remote commit
				if: github.event_name == 'repository_dispatch'
				run: |
					git submodule sync --recursive
					git submodule update --init --remote raw

			- name: Set up .NET
				uses: actions/setup-dotnet@v4
				with:
					dotnet-version: '10.0.x'

			- name: Restore dependencies
				run: dotnet restore secondBrainProcessing/secondBrainProcessing.csproj

			- name: Run second brain processor
				run: dotnet run --project secondBrainProcessing/secondBrainProcessing.csproj --configuration Release
