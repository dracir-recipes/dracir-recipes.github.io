<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ page.title }} | {{ site.title }}</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>
	<div class="container py-4 recipe-page">
		<a href="/" class="btn btn-outline-secondary btn-sm mb-3 recipe-back-btn">Back to cookbook</a>

		<article class="card p-4 recipe-shell">
			<header class="recipe-header mb-4">
				<h1 class="h2 mb-3">{{ page.title }}</h1>
				<div class="d-flex flex-wrap align-items-center gap-2 recipe-meta-row">
					{% if page.status != "🟩" %}
					<span class="badge text-bg-secondary">{{ page.status }}</span>
					{% endif %}
					{% if page.recipe-type %}
					<a href="{{ '/' | relative_url }}?type={{ page.recipe-type | cgi_escape }}" class="badge text-bg-primary text-decoration-none">{{ page.recipe-type }}</a>
					{% endif %}
					{% if page.recipe-tags %}
						{% for tag in page.recipe-tags %}
						<a href="{{ '/' | relative_url }}?tag={{ tag | cgi_escape }}" class="badge text-bg-secondary text-decoration-none">{{ tag }}</a>
						{% endfor %}
					{% endif %}
				</div>
				<div class="mt-3">
					<button type="button" class="btn btn-outline-primary btn-sm recipe-checklist-toggle" data-checklist-toggle>
						Enable checklist mode
					</button>
				</div>
			</header>

			{% if page.thumbnail %}
			<figure class="recipe-hero mb-4">
				<img src="{{ page.thumbnail }}" alt="{{ page.title }}" loading="lazy" class="img-fluid rounded-4 w-100">
			</figure>
			{% endif %}

			<div class="recipe-content">
				{{ content }}
			</div>
		</article>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<script>
		(function () {
			var toggle = document.querySelector("[data-checklist-toggle]");
			var content = document.querySelector(".recipe-content");
			if (!toggle || !content) {
				return;
			}

			var recipeKey = "recipe-checklist:" + window.location.pathname;
			var state = { enabled: false, checked: [] };

			try {
				var saved = localStorage.getItem(recipeKey);
				if (saved) {
					state = JSON.parse(saved);
				}
			} catch (err) {
				// Ignore storage failures and keep default state.
			}

			function saveState() {
				try {
					localStorage.setItem(recipeKey, JSON.stringify(state));
				} catch (err) {
					// Ignore storage failures.
				}
			}

			function getRecipeSectionItems() {
				var recipeHeading = Array.from(content.querySelectorAll("h2")).find(function (heading) {
					return heading.textContent && heading.textContent.trim().toLowerCase() === "recipe";
				});

				if (!recipeHeading) {
					return [];
				}

				var sectionItems = [];
				var node = recipeHeading.nextElementSibling;
				while (node) {
					if (node.tagName && node.tagName.toLowerCase() === "h2") {
						break;
					}
					sectionItems = sectionItems.concat(Array.from(node.querySelectorAll("li")));
					node = node.nextElementSibling;
				}

				return sectionItems;
			}

			var items = getRecipeSectionItems();
			if (items.length === 0) {
				toggle.style.display = "none";
				return;
			}

			items.forEach(function (item, index) {
				item.dataset.checklistIndex = String(index);
				var checkbox = document.createElement("input");
				checkbox.type = "checkbox";
				checkbox.className = "recipe-check-item";
				checkbox.checked = Array.isArray(state.checked) && state.checked.indexOf(index) !== -1;
				checkbox.addEventListener("change", function () {
					var itemIndex = Number(item.dataset.checklistIndex);
					if (!Array.isArray(state.checked)) {
						state.checked = [];
					}
					if (checkbox.checked) {
						if (state.checked.indexOf(itemIndex) === -1) {
							state.checked.push(itemIndex);
						}
						item.classList.add("is-checked");
					} else {
						state.checked = state.checked.filter(function (value) { return value !== itemIndex; });
						item.classList.remove("is-checked");
					}
					saveState();
				});

				item.classList.add("checklist-ready");
				item.insertBefore(checkbox, item.firstChild);
				if (checkbox.checked) {
					item.classList.add("is-checked");
				}
			});

			function syncToggleUI() {
				if (state.enabled) {
					content.classList.add("checklist-enabled");
					toggle.textContent = "Disable checklist mode";
				} else {
					content.classList.remove("checklist-enabled");
					toggle.textContent = "Enable checklist mode";
				}
			}

			function clearAllChecks() {
				state.checked = [];
				items.forEach(function (item) {
					var checkbox = item.querySelector(".recipe-check-item");
					if (checkbox) {
						checkbox.checked = false;
					}
					item.classList.remove("is-checked");
				});
			}

			toggle.addEventListener("click", function () {
				var enabling = !state.enabled;
				state.enabled = enabling;
				if (enabling) {
					clearAllChecks();
				}
				syncToggleUI();
				saveState();
			});

			syncToggleUI();
		})();
	</script>
</body>

</html>
